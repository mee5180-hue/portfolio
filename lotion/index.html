<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESOLE BARRIER LOTION</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow-x: hidden;
}

img, video {
  vertical-align: top;
  display: block;
}

.detail-page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

/* 정적 이미지 씬 */
.detail-image {
  display: block;
  width: 100%;
  height: auto;
}

/* 영상 씬 */
.video-scene {
  position: relative;
  width: 100%;
  overflow: hidden;
  line-height: 0;
}

.video-scene video {
  display: block;
  width: 100%;
  height: auto;
}

.video-text-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  display: block;
}
</style>
</head>

<div class="detail-page">

  <!-- S01: VIDEO -->
  <div class="video-scene">
    <video autoplay muted loop playsinline preload="metadata" poster="assets/S01.png">

    </video>
    <img class="video-text-overlay" src="../assets/text_S01.png" alt="">
